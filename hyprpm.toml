[repository]
name = "hyprland-grid-overview"
authors = ["maxg", "yayuuu"]
# commit_pins: [hyprland_git_commit, plugin_git_commit]
# When hyprpm builds for a Hyprland whose commit matches the left hash, it checks out the
# right hash of this repo. No match → build default-branch HEAD (same as empty pins).
# After each Hyprland release you dogfood: append ["<hl-tag-commit>", "<this-repo-commit-that-builds>"].
commit_pins = [
    ["11cbc6c577b84ffb1edf4df3fc5b6128c3ae6947", "5a563bc205f4d508ffe574d2a2666674dd9f0266"], # 0.57.2
]

[gridoverview]
description = "See Hyprland, then shape it. Free workspace grid — drag & drop, groups, pins, scratchpad tray, continuous zoom."
authors = ["maxg", "yayuuu"]
output = "gridoverview.so"
build = [
    "make all",
]
