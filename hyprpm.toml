[repository]
name = "hyprland-grid-overview"
authors = ["maxg", "yayuuu"]
# The commit pins of hyprland-scroll-overview point at upstream commits without the grid features; this fork
# builds its HEAD for the installed Hyprland version until it gets pins of its own.
commit_pins = []

[gridoverview]
description = "Workspace grid overview for Hyprland: a free grid of workspaces, scratchpads at hand, all by mouse (fork of hyprland-scroll-overview)."
authors = ["maxg", "yayuuu"]
output = "gridoverview.so"
build = [
    "make all",
]
